---
# Stage 4 — Advanced Identity. Runs against workstation.
#
# Adapted from CyberHawks `cyber-range` roles/workstation_coercion/tasks/main.yml
# (98307cc), owner permission 2026-10-03 -- see ../../../UPSTREAM.md.

- name: "Workstation coercion: upload coercion setup script"
  ansible.windows.win_copy:
    src: setup_coercion.ps1
    dest: "C:\\Windows\\Temp\\setup_coercion.ps1"
  tags: [vuln_stage4, workstation_coercion]

- name: "Workstation coercion: apply setup (WebClient auto-start, NTLM reflection weakening)"
  ansible.windows.win_shell: "C:\\Windows\\Temp\\setup_coercion.ps1"
  register: coercion_result
  changed_when: true
  tags: [vuln_stage4, workstation_coercion]

- name: "Workstation coercion: show setup result"
  ansible.builtin.debug:
    var: coercion_result.stdout_lines
  tags: [vuln_stage4, workstation_coercion]

- name: "Workstation coercion: remove temp script"
  ansible.windows.win_file:
    path: "C:\\Windows\\Temp\\setup_coercion.ps1"
    state: absent
  tags: [vuln_stage4, workstation_coercion]
