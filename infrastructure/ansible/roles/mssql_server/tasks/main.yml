---
# Install SQL Server 2019 (Developer) unattended, mixed-mode, TCP enabled.
# You must place the extracted installer at mssql_installer_path (see
# REQUIRED_INPUTS.md E1 — use Developer, NOT the Evaluation stub).

- name: Check whether the SQL Engine service already exists
  ansible.windows.win_service_info:
    name: "MSSQL${{ mssql_instance_name }}"
  register: sqlsvc
  failed_when: false

- name: Confirm the installer is present
  ansible.windows.win_stat:
    path: "{{ mssql_installer_path }}"
  register: sqlsetup
  when: not (sqlsvc.services | default([]) | length > 0)

- name: Fail early if the installer is missing
  ansible.builtin.fail:
    msg: "SQL installer not found at {{ mssql_installer_path }} — place the Developer-edition setup there (see REQUIRED_INPUTS.md E1)."
  when:
    - not (sqlsvc.services | default([]) | length > 0)
    - not (sqlsetup.stat.exists | default(false))

- name: Install SQL Server (unattended)
  ansible.windows.win_command: >-
    "{{ mssql_installer_path }}"
    /Q /ACTION=Install /FEATURES=SQLENGINE
    /INSTANCENAME={{ mssql_instance_name }}
    /SQLSYSADMINACCOUNTS="BUILTIN\Administrators"
    /SECURITYMODE={{ 'SQL' if mssql_mixed_mode else 'Windows' }}
    /SAPWD="{{ vault_mssql_sa_password }}"
    /TCPENABLED=1
    /IACCEPTSQLSERVERLICENSETERMS
  when: not (sqlsvc.services | default([]) | length > 0)
  register: sqlinstall

- name: Ensure SQL service is running + automatic
  ansible.windows.win_service:
    name: "MSSQL${{ mssql_instance_name }}"
    start_mode: auto
    state: started

- name: Open SQL port 1433 on the host firewall (range-internal only)
  community.windows.win_firewall_rule:
    name: "SQL Server 1433 (lab)"
    localport: 1433
    action: allow
    direction: in
    protocol: tcp
    state: present
    enabled: true

- name: Create the svc-sql login mapped to the domain service account
  ansible.windows.win_shell: |
    sqlcmd -S localhost -Q "IF NOT EXISTS (SELECT 1 FROM sys.server_principals WHERE name='{{ domain_netbios }}\svc-sql')
    CREATE LOGIN [{{ domain_netbios }}\svc-sql] FROM WINDOWS;"
  register: svclogin
  changed_when: "'created' not in (svclogin.stdout | default('') | lower)"
  failed_when: svclogin.rc != 0 and 'already exists' not in (svclogin.stderr | default(''))
