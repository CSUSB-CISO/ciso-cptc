# STAGE 2-4 STUB — Active Directory intentional vulnerabilities.
# Placeholder for: weak passwords / password spray targets, AS-REP roasting,
# Kerberoasting, LLMNR/NBT-NS enablement, local-admin reuse, ACL abuse,
# delegation (unconstrained/constrained/RBCD), LAPS, coercion/NTLM relay.
#
# NOT IMPLEMENTED HERE. These map to CyberHawks roles (ad_base_accounts,
# ad_delegation, ad_acls, laps, ntlm_relay_triggers, workstation_coercion,
# ad_misc_findings, dns_zone_transfer) — reusing that code requires the owner's
# explicit written permission (see ../../../UPSTREAM.md). Until then, either:
#   (a) obtain permission and port the roles (templating identity vars), or
#   (b) re-implement originally from the reference architecture.

- name: Refuse to run unimplemented vulnerability stage
  ansible.builtin.fail:
    msg: >-
      ad_attacks (Stage {{ vuln_stage }}) is a STUB. Enable only after CyberHawks
      reuse permission is confirmed or the role is re-implemented. See UPSTREAM.md.
