---
# Stage 4 — Advanced Identity. Runs against each host in laps_managed_hosts
# (workstation, ca, sql2, web — the OSes new enough to run the Windows LAPS
# client; dc1/sql1 are Server 2016 and don't support it).
#
# Adapted from CyberHawks `cyber-range` roles/laps/tasks/enable_on_targets.yml
# (98307cc), owner permission 2026-10-03 -- see ../../../UPSTREAM.md.

- name: "LAPS: upload Windows LAPS enable/rotate script"
  ansible.windows.win_copy:
    src: enable_windows_laps.ps1
    dest: "C:\\Windows\\Temp\\enable_windows_laps.ps1"
  when: inventory_hostname in laps_managed_hosts
  tags: [vuln_stage4, laps_misconfig]

- name: "LAPS: enable Windows LAPS policy and trigger initial rotation"
  ansible.windows.win_shell: "C:\\Windows\\Temp\\enable_windows_laps.ps1"
  register: laps_result
  when: inventory_hostname in laps_managed_hosts
  tags: [vuln_stage4, laps_misconfig]

- name: "LAPS: show LAPS enable result"
  ansible.builtin.debug:
    var: laps_result.stdout_lines
  when: inventory_hostname in laps_managed_hosts
  tags: [vuln_stage4, laps_misconfig]

- name: "LAPS: remove temp script"
  ansible.windows.win_file:
    path: "C:\\Windows\\Temp\\enable_windows_laps.ps1"
    state: absent
  when: inventory_hostname in laps_managed_hosts
  tags: [vuln_stage4, laps_misconfig]
