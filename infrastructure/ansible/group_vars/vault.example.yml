# ── Vault template ────────────────────────────────────────────────────────────
# 1. Copy to  vault.yml  in this directory.
# 2. Fill in real, strong, LAB-ONLY values.
# 3. Encrypt in place:   ansible-vault encrypt group_vars/vault.yml
#    (vault.yml is gitignored; the encrypted file is safe, plaintext is not.)
# 4. Put your vault password in ~/.ansible-secrets/larpers_vault_pass (gitignored).
#
# IMPORTANT (as of the Oct 2, 2026 range build): the 7 live range VMs do NOT
# share one admin password. Each was given its own unique, freshly generated
# local Administrator (or, for the Win11 workstation's local account "coach")
# password — see COACH_CREDENTIALS.md's "Range VM Administrator passwords"
# section for the real per-VM values. Copy each one in below; inventory/hosts.yml
# now references these per-host names instead of one shared variable.

vault_dc1_admin_password: "CHANGE_ME_lab_only"          # dc1 local Administrator (COACH_CREDENTIALS.md)
vault_dc2_admin_password: "CHANGE_ME_lab_only"          # dc2 local Administrator
vault_ca_admin_password: "CHANGE_ME_lab_only"           # ca local Administrator
vault_web_admin_password: "CHANGE_ME_lab_only"          # web local Administrator
vault_sql1_admin_password: "CHANGE_ME_lab_only"         # sql1 local Administrator
vault_sql2_admin_password: "CHANGE_ME_lab_only"         # sql2 local Administrator
vault_workstation_admin_password: "CHANGE_ME_lab_only"  # workstation local account "coach"

# Domain Administrator password used for domain-level operations (the
# domain_join role's domain_admin_password, and any future dc2-promotion
# task). AD DS promotion elevates dc1's EXISTING local Administrator account
# to be the domain's — so this should be set to the SAME value as
# vault_dc1_admin_password above, not a new password.
vault_windows_admin_password: "CHANGE_ME_lab_only"   # = vault_dc1_admin_password

vault_dsrm_password: "CHANGE_ME_dsrm_lab_only"       # DC restore-mode password (new, your choice)
vault_mssql_sa_password: "CHANGE_ME_sa_lab_only"     # SQL 'sa' (mixed mode, your choice)

# Default password for the synthetic AD user accounts (Stage 1: strong).
# Stage 2 replaces specific accounts with intentionally weak/known values.
vault_ad_user_default_password: "CHANGE_ME_users_lab_only"

# ── Stage 2 — Basic Assessment (intentional vulnerabilities) ─────────────────
# Ported/adapted from CyberHawks `cyber-range` (98307cc), owner permission
# 2026-10-03 — see UPSTREAM.md. Lab-only, deliberately weak/known values;
# NEVER reuse any of these outside this isolated range.

# Weak/dictionary passwords for the three Stage 1 accounts also used as
# password-spray targets (see group_vars/all.yml ad_weak_password_accounts).
# Pick genuinely weak/dictionary values on purpose (that's the finding) —
# just don't reuse the SAME value across all three, or spraying one
# password across the account list stops being an interesting exercise.
vault_weak_password_c_churro: "CHANGE_ME_weak_lab_only"   # e.g. a season+year pattern
vault_weak_password_w_wrench: "CHANGE_ME_weak_lab_only"   # e.g. a keyboard-walk pattern
vault_weak_password_g_usher: "CHANGE_ME_weak_lab_only"    # e.g. a company+123 pattern

# AS-REP roastable account's password (svc-reports) — also deliberately
# weak/crackable once the AS-REP hash is obtained (that's the point).
vault_asrep_svc_reports_password: "CHANGE_ME_asrep_lab_only"

# Kerberoastable account's password (svc-sql) — this REPLACES svc-sql's
# Stage 1 strong password once vuln_stage >= 2. Deliberately crackable.
vault_kerberoastable_svc_sql_password: "CHANGE_ME_kerberoast_lab_only"

# Local administrator password reuse — the SAME value is planted as the
# "svc-helpdesk" local admin account's password on workstation, sql1,
# sql2, and web (group_vars/all.yml local_admin_reuse_hosts). This is
# ALSO the password the GPP cpassword finding (dc1 SYSVOL) reveals, so the
# two findings intentionally chain together.
vault_local_admin_reuse_password: "CHANGE_ME_reused_lab_only"

# ── Stage 3 — Business Services (intentional vulnerabilities) ──────────────
# Ported/adapted from CyberHawks `cyber-range` (98307cc), owner permission
# 2026-10-03 — see UPSTREAM.md. Lab-only, deliberately weak/known values;
# NEVER reuse any of these outside this isolated range.

# sa's REPLACEMENT password once vuln_stage >= 3 (roles/mssql_misconfig)
# on both sql1 and sql2 — deliberately weak/default, unlike Stage 1's
# strong vault_mssql_sa_password above. Also used as the sql1->sql2
# linked-server login password, so this one value drives both the
# "weak/default sa password" finding and the "limited linked-server"
# finding.
vault_mssql_weak_sa_password: "CHANGE_ME_sa_weak_lab_only"

# GuestPortal's SQL login password (svc-web) — the IIS portal's
# connection-string credential, leaked in plaintext via Web.config.bak
# (roles/web_portal). Deliberately not vault_mssql_sa_password-strength;
# pick a crackable-but-plausible value.
vault_web_portal_svc_web_password: "CHANGE_ME_svcweb_lab_only"

# svc-web's SEPARATE local Windows account password on `web` (the IIS app
# pool identity, added to local Administrators — the "over-privileged
# service account" finding). Intentionally a different value from the SQL
# login above so the two leak paths (Web.config.bak vs. local-account
# compromise) don't collapse into the same credential.
vault_web_portal_svc_web_local_password: "CHANGE_ME_svcweb_local_lab_only"

# Fake "API key" suffix planted in the workstation ticketing-tool config
# leak (roles/workstation_artifacts) — not a real secret format, just
# needs to look plausible in a grep/strings pass.
vault_workstation_app_config_api_key: "CHANGE_ME_apikey_lab_only"
