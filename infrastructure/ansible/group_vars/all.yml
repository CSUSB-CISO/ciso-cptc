# ═══════════════════════════════════════════════════════════════════════════
#  The Larpers — CPTC training range :: master variables
#  This is the file coaches edit most. Everything is variable-driven; nothing
#  about the reference environment ("CyberHawks") is hardcoded anywhere.
#  Values marked [PROPOSAL] are safe defaults — change or keep them.
# ═══════════════════════════════════════════════════════════════════════════

# ── Staging ──────────────────────────────────────────────────────────────────
# 1 = MVP (AD/DNS/SQL/benign data, NO exploits). 2-4 unlock intentional vulns
# (currently stubbed pending CyberHawks reuse permission — see UPSTREAM.md).
vuln_stage: 1

# ── Identity / branding ──────────────────────────────────────────────────────
# Themed to the CPTC12 (2026-27) scenario: "Butters Family Farm" — an aging
# family-owned THEME PARK (rides, attractions, patron operations). The "aging"
# framing intentionally justifies mixed-age Windows Servers at later stages.
# This is a TRAINING analogue, not the real competition environment.
company_name: "Butters Family Farm"      # CPTC12 theme (theme-park operator)
company_short: "BFF"
# RESOLVED (2026-10-02, coach decision): domain stays thelarpers.local/THELARPERS
# even though the fictional company (theme-park) name is "Butters Family Farm" —
# the two are intentionally decoupled: company_name is the in-universe scenario
# brand, domain_dns_name is the team's own range identity ("The Larpers").
domain_dns_name: "thelarpers.local"
domain_netbios: "THELARPERS"
# Derived automatically (do not edit): DC=thelarpers,DC=local
domain_dn: "DC={{ domain_dns_name.split('.') | join(',DC=') }}"

branding_team_name: "The Larpers"
branding_primary_hex: "#0065BD"          # CSUSB Coyote Blue
branding_accent_hex: "#3DB7E4"

# ── Network ──────────────────────────────────────────────────────────────────
ip_network: "10.20.10.0/24"
gateway: "10.20.10.1"                    # ("" if fully isolated)
dns_primary: "10.20.10.2"                # dc1

# Real, live range topology (7 VMs, VMIDs 320-326 on Proxmox node pve3) as
# cloned/OOBE'd/static-IP'd on October 2, 2026. OS reflects the template each
# VM was actually cloned from, not the design review's proposed mapping.
#
# NOTE (updated 2026-10-02) — dc2 remains the one unautomated host:
#   - dc2: the `domain_controller` role only promotes a brand-new forest
#     (`microsoft.ad.domain` with no DC-join mode). Pointing it at dc2 would
#     try to create a second forest instead of joining dc2 to the one dc1
#     creates, which would corrupt the domain. Rather than build a new
#     "additional domain controller" Ansible role, the coach promotes dc2
#     manually — see docs/dc2-manual-promotion.md.
# ca and web NOW have Ansible roles (adcs_ca, iis_web) and ARE wired into
# site.yml (domain_join + their own role, right after the domain_controller
# play). dc1, sql1, sql2, ca, web, and workstation are all wired today; only
# dc2 is intentionally left out.
hosts:
  dc1:         { ip: "10.20.10.2", role: dc,          os: win2016 }
  dc2:         { ip: "10.20.10.3", role: dc,          os: win2019 }   # manual promotion only — see NOTE above
  ca:          { ip: "10.20.10.4", role: ca,          os: win2019 }
  web:         { ip: "10.20.10.5", role: web,         os: win2022 }
  sql1:        { ip: "10.20.10.6", role: sql,         os: win2016 }
  sql2:        { ip: "10.20.10.7", role: sql,         os: win2022 }
  workstation: { ip: "10.20.10.8", role: workstation, os: win11, persona: guest_services }

# ── Active Directory content (Stage 1) ───────────────────────────────────────
# Synthetic only. NO real CSUSB/student/customer data anywhere.
# Theme-park org structure (Butters Family Farm).
ad_ous:
  - "Park"
  - "Park/RidesAndAttractions"
  - "Park/GuestServices"
  - "Park/FoodAndBeverage"
  - "Park/Maintenance"
  - "Park/Finance"
  - "Park/HR"
  - "Park/IT"
  - "Park/ServiceAccounts"
  - "Park/Workstations"

ad_groups:
  - { name: "Rides-Ops",       ou: "Park/RidesAndAttractions" }
  - { name: "GuestServices",   ou: "Park/GuestServices" }
  - { name: "FnB-Staff",       ou: "Park/FoodAndBeverage" }
  - { name: "Maintenance",     ou: "Park/Maintenance" }
  - { name: "Finance-Users",   ou: "Park/Finance" }
  - { name: "HR-Users",        ou: "Park/HR" }
  - { name: "IT-Admins",       ou: "Park/IT" }
  - { name: "SQL-Admins",      ou: "Park/IT" }

# Starter users. Passwords come from Vault (per-role), never hardcoded here.
# In MVP these are ordinary strong-password accounts; Stage 2 introduces the
# intentional weaknesses. Names are fictional, themed to the park.
ad_users:
  - { sam: "r.coaster",  name: "Rowan Coaster",  ou: "Park/RidesAndAttractions", groups: ["Rides-Ops"] }
  - { sam: "g.usher",    name: "Gale Usher",     ou: "Park/GuestServices",       groups: ["GuestServices"] }
  - { sam: "c.churro",   name: "Casey Churro",   ou: "Park/FoodAndBeverage",     groups: ["FnB-Staff"] }
  - { sam: "w.wrench",   name: "Wes Wrench",     ou: "Park/Maintenance",         groups: ["Maintenance"] }
  - { sam: "a.finance",  name: "Avery Ledger",   ou: "Park/Finance",             groups: ["Finance-Users"] }
  - { sam: "i.tanaka",   name: "Ilya Tanaka",    ou: "Park/IT",                  groups: ["IT-Admins"] }
  - { sam: "svc-sql",    name: "SQL Service",    ou: "Park/ServiceAccounts",     groups: ["SQL-Admins"] }

# SMB shares to create on dc1 (Stage 1 = benign; Stage 3 adds sensitive drops).
smb_shares:
  - { name: "Public",      path: "C:\\Shares\\Public",      everyone_read: true }
  - { name: "Finance",     path: "C:\\Shares\\Finance",     groups_rw: ["Finance-Users"] }
  - { name: "Maintenance", path: "C:\\Shares\\Maintenance", groups_rw: ["Maintenance"] }

# ── SQL Server (Stage 1) ─────────────────────────────────────────────────────
mssql_instance_name: "MSSQLSERVER"        # default instance
mssql_edition: "Developer"                # NOT Evaluation (see REQUIRED_INPUTS.md E1)
mssql_business_db: "ParkOps"              # theme-park operations DB
# RESOLVED (2026-10-02, coach decision): 2 SQL servers (sql1/sql2) confirmed.
# Installer ships as a mounted ISO on each SQL host (coach's own media), not a
# pre-extracted copy under C:\Installers — Windows assigns the mounted-ISO
# drive letter D: when C: is the only existing disk (standard on these VMs).
mssql_installer_path: 'D:\\setup.exe'     # root of the mounted SQL ISO (coach confirmed)
mssql_mixed_mode: true                    # SQL auth enabled (realistic; sa in Vault)

# ── Workstation personas (Stage 1 uses one) ──────────────────────────────────
persona_profiles:
  guest_services: { display: "Guest Services / Ticketing Workstation" }
  rides_ops:      { display: "Ride Operations Workstation" }
  maintenance:    { display: "Maintenance Shop Workstation" }
  finance:        { display: "Finance Workstation" }
  it:             { display: "IT Support Workstation" }
  exec:           { display: "Park Manager (Executive) Workstation" }

# ── Stage 2 — Basic Assessment (intentional vulnerabilities) ─────────────────
# Ported/adapted from CyberHawks `cyber-range` (98307cc) per UPSTREAM.md, under
# the owner's out-of-band reuse permission (2026-10-03). Every finding below
# is gated by `vuln_stage | int >= 2` in site.yml AND carries its own Ansible
# tag (vault.example.yml documents the matching secret placeholders). No real
# secrets live in this file — only identities/placements.

# Weak/reused-password accounts (dc1) — reuses existing Stage 1 ad_users
# above rather than inventing a parallel identity set; these three get a
# dictionary-weak password instead of vault_ad_user_default_password. The
# same accounts double as password-spray targets (see ad_password_spray_*
# lockout settings below — generous on purpose so spraying doesn't lock
# them out before students can demonstrate it).
ad_weak_password_accounts:
  - { sam: "c.churro", password_var: "vault_weak_password_c_churro" }
  - { sam: "w.wrench",  password_var: "vault_weak_password_w_wrench" }
  - { sam: "g.usher",   password_var: "vault_weak_password_g_usher" }

ad_password_spray_lockout_threshold: 50        # attempts before lockout (generous = spray-safe)
ad_password_spray_lockout_window_minutes: 30   # observation window
ad_password_spray_lockout_duration_minutes: 30 # auto-unlock after this long

# AS-REP roastable account(s) (dc1) — "Do not require Kerberos
# preauthentication". A dedicated legacy-automation service account rather
# than a renamed Stage 1 person, since disabling preauth is themed as an
# old scheduled-automation account nobody re-reviewed.
ad_asrep_roast_accounts:
  - sam: "svc-reports"
    name: "Reports Automation"
    ou: "Park/ServiceAccounts"
    password_var: "vault_asrep_svc_reports_password"

# Kerberoastable account(s) (dc1, sql1) — SPN registered + crackable
# password. svc-sql already exists as the Stage 1 SQL service account
# (Park/ServiceAccounts, SQL-Admins) and is the natural Kerberoasting
# target: its SPN points at sql1 and its password is swapped for a
# crackable one here.
ad_kerberoastable_accounts:
  - sam: "svc-sql"
    spn: "MSSQLSvc/sql1.{{ domain_dns_name }}:1433"
    password_var: "vault_kerberoastable_svc_sql_password"

# GPP (Group Policy Preferences) cpassword finding (dc1 SYSVOL). Creates a
# brand-new local account via GPP's "Local Users and Groups" preference
# (not the built-in Administrator — see roles/ad_misc_findings notes) and
# links it to the Workstations OU. The planted password is the SAME value
# as local_admin_reuse_password below, so finding the GPP cpassword also
# hands over the reused local-admin credential (intentional chaining, not
# an unrelated duplicate finding).
gpp_target_ou: "Park/Workstations"
gpp_gpo_name: "Workstation Local Admin Reset"
gpp_local_account_name: "svc-helpdesk"

# SMB credential exposure (dc1, workstation) — a plaintext credential left
# on an open/misconfigured share. dc1 gets its own small IT-support share;
# workstation's leg is layered onto the smb_file_dump share below.
smb_credential_leak_share_dc1:
  name: "ITSupport"
  path: 'C:\Shares\ITSupport'
  leak_username: "svc-reports"
  leak_password_var: "vault_asrep_svc_reports_password"

# SMB share enumeration/dumps (web, workstation) — world-readable share
# full of realistic filler documents. workstation's copy additionally
# embeds the credential-leak file above (dc1's SMB-credential-exposure
# finding is mirrored here for the "workstation" host in the Stage 2 map).
smb_file_dump_share:
  name: "Shared"
  path: 'C:\Shared'

# Local administrator password reuse (workstation, sql1, sql2, web) — a
# dedicated local account with the SAME password planted on all four
# hosts, distinct from each host's own unique build-time local
# Administrator password (COACH_CREDENTIALS.md / inventory/hosts.yml).
# Models a reused "helpdesk" gold-image local-admin account.
local_admin_reuse_hosts: ["workstation", "sql1", "sql2", "web"]
local_admin_reuse_account_name: "svc-helpdesk"

# Straightforward workstation privilege escalation — low-priv domain group
# that gets the weak permissions below (rather than a single named user,
# so the finding isn't tied to one persona's account).
privesc_target_group: "Domain Users"

# ── Safety ───────────────────────────────────────────────────────────────────
# Refuse to run if the range can reach the Internet (checked in common_prereqs).
enforce_isolation_check: true
