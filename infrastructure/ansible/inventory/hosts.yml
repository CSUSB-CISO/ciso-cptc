# MVP inventory (vuln_stage 1). IPs must match terraform/terraform.tfvars.
# Managed over WinRM/NTLM as local Administrator (control host is not
# domain-joined — mirrors the reference architecture's approach).
all:
  vars:
    ansible_connection: winrm
    ansible_winrm_transport: ntlm
    ansible_port: 5985
    ansible_winrm_server_cert_validation: ignore
    ansible_user: Administrator
    ansible_password: "{{ vault_windows_admin_password }}"
  children:
    domain_controllers:
      hosts:
        dc1:
          ansible_host: 10.20.10.10
    sql_servers:
      hosts:
        sql1:
          ansible_host: 10.20.10.20
    workstations:
      hosts:
        ws1:
          ansible_host: 10.20.10.50
          persona: guest_services
    # kali is provisioned by Terraform and configured from cptc-2026-attacker-vms;
    # it is not managed by this Windows-focused playbook.
