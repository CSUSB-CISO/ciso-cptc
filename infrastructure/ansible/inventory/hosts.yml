# Real range inventory (7 VMs, VMIDs 320-326, static IPs confirmed Oct 2, 2026).
# IPs must match group_vars/all.yml `hosts:` and terraform/terraform.tfvars.
# Managed over WinRM/NTLM (control host is not domain-joined — mirrors the
# reference architecture's approach).
#
# IMPORTANT — per-host credentials, not one shared password: each of the 7
# range VMs was given its OWN unique, freshly generated local Administrator
# (or, for the Win11 workstation, local-account) password at build time —
# see COACH_CREDENTIALS.md's "Range VM Administrator passwords" section
# (coach-local only; never committed, and not available to this assistant).
# That means ansible_user/ansible_password must be set PER HOST below, each
# pointing at its own vault_<host>_admin_password — there is no single
# shared vault_windows_admin_password that works for WinRM login anymore.
# vault_windows_admin_password is kept (see group_vars/vault.example.yml)
# specifically as the DOMAIN Administrator password — i.e. a copy of dc1's
# local Administrator password, since AD DS promotion elevates that same
# account — and is what domain_join/future dc2-promotion use for the
# domain-level operation itself, separate from the WinRM login below.
all:
  vars:
    ansible_connection: winrm
    ansible_winrm_transport: ntlm
    ansible_port: 5985
    ansible_winrm_server_cert_validation: ignore
  children:
    domain_controllers:
      hosts:
        dc1:
          ansible_host: 10.20.10.2
          ansible_user: Administrator
          ansible_password: "{{ vault_dc1_admin_password }}"
    sql_servers:
      hosts:
        sql1:
          ansible_host: 10.20.10.6
          ansible_user: Administrator
          ansible_password: "{{ vault_sql1_admin_password }}"
        sql2:
          ansible_host: 10.20.10.7
          ansible_user: Administrator
          ansible_password: "{{ vault_sql2_admin_password }}"
    workstations:
      hosts:
        workstation:
          ansible_host: 10.20.10.8
          persona: guest_services
          # OOBE rejected "administrator" as a local account name on this
          # Win11 box — the local account actually created is "coach".
          ansible_user: coach
          ansible_password: "{{ vault_workstation_admin_password }}"
    # ca and web now HAVE Ansible roles (adcs_ca, iis_web — added 2026-10-02)
    # and ARE wired into site.yml (domain_join + their own role). dc2 is the
    # one exception: it stays inventoried here for IP/hostname tracking only
    # and is deliberately NOT wired into any site.yml play. Do NOT add dc2 to
    # domain_controllers: that role (microsoft.ad.domain) promotes a brand
    # new forest and would try to create a second one on dc2 instead of
    # joining it to dc1's, corrupting the domain. No "join an existing forest"
    # Ansible role exists (and per coach decision, dc2's promotion is done
    # manually instead — see docs/dc2-manual-promotion.md).
    additional_domain_controllers:
      hosts:
        dc2:
          ansible_host: 10.20.10.3
          ansible_user: Administrator
          ansible_password: "{{ vault_dc2_admin_password }}"
    certificate_authorities:
      hosts:
        ca:
          ansible_host: 10.20.10.4
          ansible_user: Administrator
          ansible_password: "{{ vault_ca_admin_password }}"
    web_servers:
      hosts:
        web:
          ansible_host: 10.20.10.5
          ansible_user: Administrator
          ansible_password: "{{ vault_web_admin_password }}"
    # kali is provisioned by Terraform and configured from cptc-2026-attacker-vms;
    # it is not managed by this Windows-focused playbook.
