---
# ═══════════════════════════════════════════════════════════════════════════
#  Full build of The Larpers CPTC range. Idempotent — safe to re-run.
#  Prereq: Terraform has created the VMs; vault.yml exists & is encrypted.
#  Run:  ansible-playbook site.yml
# ═══════════════════════════════════════════════════════════════════════════

- name: Load vault secrets everywhere
  hosts: all
  gather_facts: false
  vars_files:
    - group_vars/vault.yml
  tasks:
    - ansible.builtin.debug:
        msg: "Building '{{ company_name }}' range for {{ branding_team_name }} — vuln_stage {{ vuln_stage }}"
      run_once: true

- name: Common prep (all Windows hosts)
  # Includes dc2/ca/web too: common_prereqs is generic (isolation guard,
  # timezone, hostname-to-inventory-name rename) and safe to run on them even
  # though they have no role of their own yet — see group_vars/all.yml NOTE.
  hosts: domain_controllers:additional_domain_controllers:certificate_authorities:web_servers:sql_servers:workstations
  gather_facts: true
  vars_files: [group_vars/vault.yml]
  roles:
    - common_prereqs

- name: Domain controller — promote + populate AD
  hosts: domain_controllers
  gather_facts: true
  vars_files: [group_vars/vault.yml]
  roles:
    - domain_controller

- name: SQL server — install SQL + benign business database
  hosts: sql_servers
  gather_facts: true
  vars_files: [group_vars/vault.yml]
  roles:
    - mssql_server
    - business_data

# ── Certificate Authority + Web server (added 2026-10-02) ──────────────────
# dc2 is deliberately NOT included below — promoting an additional domain
# controller is done manually by the coach (see
# docs/dc2-manual-promotion.md), not via Ansible. ca and web, by contrast,
# only need a plain domain join plus their own role — no new-forest-vs-join
# ambiguity — so they're safe to automate. See roles/adcs_ca and
# roles/iis_web for the design rationale (Enterprise Root CA, single-tier;
# Stage 1 static placeholder page).
- name: Certificate Authority + Web server — join domain
  hosts: certificate_authorities:web_servers
  gather_facts: true
  vars_files: [group_vars/vault.yml]
  roles:
    - domain_join

- name: Certificate Authority — install AD CS (Enterprise Root CA)
  hosts: certificate_authorities
  gather_facts: true
  vars_files: [group_vars/vault.yml]
  roles:
    - adcs_ca

- name: Web server — install IIS + placeholder intranet page
  hosts: web_servers
  gather_facts: true
  vars_files: [group_vars/vault.yml]
  roles:
    - iis_web

- name: Workstation — join to domain
  hosts: workstations
  gather_facts: true
  vars_files: [group_vars/vault.yml]
  roles:
    - domain_join

# ── DHCP for cptcnet (added 2026-10-02) ─────────────────────────────────────
# dc2 is the DHCP server (dc1 stays forest-root DNS/DC only — a common
# split). This play only succeeds once dc2 is an actual domain controller,
# i.e. after the coach has run docs/dc2-manual-promotion.md by hand — until
# then it will fail to connect/authorize and should simply be skipped
# (comment out the play, or run with --limit to exclude it) rather than
# treated as a site.yml regression. DNS itself needs no role here: both dc1
# and dc2 already run DNS as a side effect of being domain controllers.
- name: DHCP server — serve cptcnet (dc2, after its manual promotion)
  hosts: additional_domain_controllers
  gather_facts: true
  vars_files: [group_vars/vault.yml]
  roles:
    - dhcp_server

# ── Intentional vulnerabilities — Stage 2 (Basic Assessment) ────────────────
# Ported/adapted from CyberHawks `cyber-range` (98307cc) per the owner's
# out-of-band reuse permission, 2026-10-03 — see UPSTREAM.md. Each finding
# below is its own role (mirroring the CyberHawks source role names 1:1
# where one exists) AND its own Ansible tag, so a coach can disable any
# single finding with --skip-tags without rebuilding the range. The whole
# stage is additionally gated on vuln_stage so Stage 1 builds (vuln_stage:
# 1, the default) never touch any of this. Stage 3/4 (mssql_misconfig,
# adcs_esc) remain STUBS — untouched, out of scope for this port.
- name: Stage 2 — AD findings on dc1 (weak/spray passwords, AS-REP, Kerberoast)
  hosts: domain_controllers
  gather_facts: false
  vars_files: [group_vars/vault.yml]
  roles:
    - role: ad_base_accounts
      when: vuln_stage | int >= 2
    - role: ad_misc_findings
      when: vuln_stage | int >= 2
    - role: dns_zone_transfer
      when: vuln_stage | int >= 2

- name: Stage 2 — workstation findings (privesc, LLMNR default, SMB dump)
  hosts: workstations
  gather_facts: false
  vars_files: [group_vars/vault.yml]
  roles:
    - role: workstation_privesc
      when: vuln_stage | int >= 2
    - role: smb_file_dump
      when: vuln_stage | int >= 2

- name: Stage 2 — SMB share dump on web
  hosts: web_servers
  gather_facts: false
  vars_files: [group_vars/vault.yml]
  roles:
    - role: smb_file_dump
      when: vuln_stage | int >= 2

- name: Stage 2 — local administrator password reuse (workstation, sql1, sql2, web)
  hosts: workstations:sql_servers:web_servers
  gather_facts: false
  vars_files: [group_vars/vault.yml]
  roles:
    - role: local_admin_reuse
      when: vuln_stage | int >= 2

# ── Intentional vulnerabilities — Stage 3 (Business Services) ──────────────
# Ported/adapted from CyberHawks `cyber-range` (98307cc) per the owner's
# out-of-band reuse permission, 2026-10-03 — see UPSTREAM.md. Same pattern
# as Stage 2 above: each finding is its own role/task file AND its own
# Ansible tag, and the whole stage is additionally gated on vuln_stage so
# lower-stage builds never touch any of this. Replaces
# roles/_vuln_stubs/mssql_misconfig (deleted; superseded by the real role
# below). Order matters here: the sql_servers play must run before the
# web_servers:sql_servers play, since roles/mssql_misconfig fetches the
# business-DB .bak that roles/web_portal then copies onto web's share.

- name: Stage 3 — SQL Server misconfigurations (sql1, sql2)
  hosts: sql_servers
  gather_facts: false
  vars_files: [group_vars/vault.yml]
  roles:
    - role: mssql_misconfig
      when: vuln_stage | int >= 3

- name: Stage 3 — IIS employee/customer portal (web, sql1)
  hosts: web_servers:sql_servers
  gather_facts: false
  vars_files: [group_vars/vault.yml]
  roles:
    - role: web_portal
      when: vuln_stage | int >= 3

- name: Stage 3 — Windows 11 user artifacts (workstation)
  hosts: workstations
  gather_facts: false
  vars_files: [group_vars/vault.yml]
  roles:
    - role: workstation_artifacts
      when: vuln_stage | int >= 3

# ── Intentional vulnerabilities — Stage 4 (Advanced Identity) ──────────────
# Ported/adapted from CyberHawks `cyber-range` (98307cc) per the owner's
# out-of-band reuse permission, 2026-10-03 — see UPSTREAM.md. Same pattern
# as Stage 2/3 above: each finding is its own role AND its own Ansible tag,
# and the whole stage is additionally gated on vuln_stage so lower-stage
# builds never touch any of this. Replaces roles/_vuln_stubs/adcs_esc
# (deleted; superseded by the real role below).
#
# RESOLVED delegation-assignment decision (2026-10-03,
# CPTC_Vulnerability_Map.md): sql1$/sql2$ get constrained delegation; web$
# gets unconstrained delegation (not ca), paired with Print Spooler left
# running on dc1/dc2 for the PrinterBug coercion path into web's delegation.
#
# The "SQL privilege escalation + linked servers (sql2 -> sql1)" finding is
# intentionally NOT wired in here — it depends on the Stage 3 linked-server
# setup in roles/mssql_misconfig and is deferred pending that role's own
# review; see UPSTREAM.md.
#
# ad_delegation and laps each span dc1/dc2/web and dc1/dc2/ca/sql2/web/
# workstation respectively — rather than one role instance per host group
# (which would re-run common setup redundantly across plays), each is
# applied ONCE to a play covering every host it touches, with per-host
# `when` guards inside the role's own tasks/main.yml dispatcher.

- name: Stage 4 — AD delegation abuse (dc1, dc2, web)
  hosts: domain_controllers:additional_domain_controllers:web_servers
  gather_facts: false
  vars_files: [group_vars/vault.yml]
  roles:
    - role: ad_delegation
      when: vuln_stage | int >= 4

- name: Stage 4 — AD ACL abuse (dc1; ACEs replicate to dc2)
  hosts: domain_controllers
  gather_facts: false
  vars_files: [group_vars/vault.yml]
  roles:
    - role: ad_acls
      when: vuln_stage | int >= 4

- name: Stage 4 — LAPS misconfiguration (dc1, dc2, ca, sql2, web, workstation)
  hosts: domain_controllers:additional_domain_controllers:certificate_authorities:sql_servers:web_servers:workstations
  gather_facts: false
  vars_files: [group_vars/vault.yml]
  roles:
    - role: laps
      when: vuln_stage | int >= 4

- name: Stage 4 — AD CS (ADCS) ESC misconfiguration (dc1, ca)
  hosts: domain_controllers:certificate_authorities
  gather_facts: false
  vars_files: [group_vars/vault.yml]
  roles:
    - role: adcs_esc
      when: vuln_stage | int >= 4

- name: Stage 4 — NTLM relay / coercion triggers (dc1, dc2, web, workstation)
  hosts: domain_controllers:additional_domain_controllers:web_servers:workstations
  gather_facts: false
  vars_files: [group_vars/vault.yml]
  roles:
    - role: ntlm_relay_triggers
      when: vuln_stage | int >= 4

- name: Stage 4 — workstation coercion setup (workstation)
  hosts: workstations
  gather_facts: false
  vars_files: [group_vars/vault.yml]
  roles:
    - role: workstation_coercion
      when: vuln_stage | int >= 4
